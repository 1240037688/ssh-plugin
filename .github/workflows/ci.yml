name: CI

on:
  push:
    branches: [main, feature/**, codex/**]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install "fastapi>=0.100" "pydantic>=2" "paramiko>=3"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Byte-compile
        run: |
          python -m py_compile deploy_paths.py download_plan.py security.py secret_store.py ssh_session.py sftp_client.py sync_plan.py tools.py schemas.py __init__.py dashboard/plugin_api.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Desktop plugin syntax
        # node --check treats .js as script and misses ESM parse errors
        # (e.g. unbalanced parens). Copy to .mjs so Hermes-style module parse runs.
        run: |
          cp desktop/plugin.js /tmp/plugin.mjs
          node --check /tmp/plugin.mjs
          node --check desktop/plugin.js

  plugin-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure plugin.yaml exists
        run: test -f plugin.yaml && test -f dashboard/manifest.json && test -f desktop/plugin.js
